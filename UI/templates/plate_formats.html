<div id="formats" class="tab-content"
    style="padding: 1.5rem 2rem; color: #eee; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">

    <!-- Title at the top -->
    <h2 style="margin-bottom: 1.5rem; font-weight: 700; color: #f0f0f0;">Plate Format Management</h2>

    <!-- Formats Table -->
    <table style="width: 100%; border-collapse: collapse; margin-bottom: 2rem; background-color: #222;">
        <thead>
            <tr style="border-bottom: 1px solid #444;">
                <th style="text-align: left; padding: 0.75rem 1rem; font-weight: 600; color: #aaa; min-width: 150px;">
                    Format Name</th>
                <th style="text-align: left; padding: 0.75rem 1rem; font-weight: 600; color: #aaa;">Regex Pattern</th>
                <th style="width: 100px; padding: 0.75rem 1rem; font-weight: 600; color: #aaa; text-align: center;">
                    Actions</th>
            </tr>
        </thead>
        <tbody id="formatList" style="font-size: 0.95rem; font-family: monospace; color: #ddd;">
            <!-- Rows inserted here dynamically -->
        </tbody>
    </table>

    <!-- Add Format Form: inputs + button on the same row -->
    <form id="addFormatForm" style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
        <div style="flex: 1 1 150px; min-width: 150px;">
            <label for="formatName" style="display: block; margin-bottom: 0.3rem; color: #bbb; font-weight: 600;">Format
                Name</label>
            <input type="text" id="formatName" placeholder="e.g. US_STANDARD" required
                style="width: 100%; padding: 0.5rem 0.75rem; border-radius: 4px; border: 1px solid #555; background-color: #1a1a1a; color: #eee;" />
        </div>
        <div style="flex: 2 1 300px; min-width: 250px;">
            <label for="formatRegex" style="display: block; margin-bottom: 0.3rem; color: #bbb; font-weight: 600;">Regex
                Pattern</label>
            <input type="text" id="formatRegex" placeholder="e.g. [A-Z]{3}\\d{3}" required
                style="width: 100%; padding: 0.5rem 0.75rem; border-radius: 4px; border: 1px solid #555; background-color: #1a1a1a; color: #eee;" />
        </div>
        <div style="flex: 0 0 100px; display: flex; justify-content: center;">
            <button type="submit"
                style="background-color: #2980b9; color: white; border: none; padding: 0.55rem 1.2rem; border-radius: 4px; font-weight: 600; cursor: pointer; transition: background-color 0.3s;">
                Add
            </button>
        </div>
    </form>

</div>
