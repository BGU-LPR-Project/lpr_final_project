<div id="main" class="tab-content active">
    <div class="panel">
        <div class="stream-box" role="region" aria-label="Live Camera Stream"
            style="text-align: center; position: relative;">
            <!-- MJPEG Live Stream Image -->
            <img id="liveStreamImg" alt="Live Feed" style="display:none; max-width: 100%;" />

            <!-- Placeholder for messages + spinner -->
            <div id="placeholder" style="color: gray; font-style: italic; user-select: none;">
                <div id="startSpinner"
                    style="display: none; margin: 0 auto 8px auto; width: 24px; height: 24px; border: 3px solid #888; border-top: 3px solid white; border-radius: 50%; animation: spin 1s linear infinite;">
                </div>
                <p id="placeholderText">Waiting for stream to start...</p>
            </div>
        </div>

        <div class="controls" role="toolbar" aria-label="Video Controls"
            style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">

            <!-- Button Group (Left-Aligned) -->
            <div class="button-group" style="display: flex; gap: 0.5rem;">
                <button id="startBtn" title="Start Stream" style="display: flex; align-items: center; gap: 0.5rem;">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M5 3v18l15-9z" />
                    </svg>
                    Start
                </button>
                <button onclick="callApi('/pause-video')" title="Pause Stream">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="6" y="4" width="4" height="16" />
                        <rect x="14" y="4" width="4" height="16" />
                    </svg> Pause
                </button>
                <button onclick="callApi('/resume-video')" title="Resume Stream">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M5 3v18l15-9z" />
                    </svg> Resume
                </button>
                <button onclick="callApi('/restart-video')" title="Restart Stream">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M1 4v6h6" />
                        <circle cx="12" cy="12" r="8" />
                        <path d="M23 20v-6h-6" />
                    </svg> Restart
                </button>
                {% if session.get('role') == 'admin' %}
                <button onclick="callApi('/skip-10s')" title="Skip 10 Seconds">
                    <!-- SVG icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 4l10 8-10 8V4z" />
                        <path d="M14 4l6 8-6 8V4z" />
                    </svg> +10s
                </button>
                {% else %}
                <button class="disabled-button" disabled title="admin only feature"
                    style="opacity: 0.5; cursor: default;">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 4l10 8-10 8V4z" />
                        <path d="M14 4l6 8-6 8V4z" />
                    </svg> +10s
                </button>
                {% endif %}
            </div>

            <!-- Video selector dropdown -->
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <label for="videoSelect" style="font-size: 0.9rem; cursor: pointer;">Select Video:</label>
                <select id="videoSelect" style="font-size: 0.9rem; min-width: 150px;">
                    <option value="" disabled selected>-- Choose a video --</option>
                </select>
            </div>

            <!-- Upload Form (Right-Aligned) -->
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                {% if session.get('role') == 'admin' %}
                <form id="uploadForm" enctype="multipart/form-data" onsubmit="upload_video(event)"
                    style="display: flex; align-items: center; gap: 0.5rem;">
                    <!-- Upload icon label -->
                    <label for="videoUpload" title="Upload a Video" style="cursor: pointer;">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px;">
                            <path d="M4 16v1a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1M12 12V4m0 0L8 8m4-4 4 4" />
                        </svg>
                    </label>

                    <!-- File input -->
                    <input type="file" id="videoUpload" name="video" accept="video/*" style="display: none;" required>

                    <!-- Submit button -->
                    <button type="submit" title="Upload Video" style="font-size: 0.9rem;">Upload</button>
                </form>
                {% else %}
                <!-- Disabled version for non-admins -->
                <div style="display: flex; align-items: center; gap: 0.5rem; opacity: 0.5; cursor: default;"
                    title="admin only feature">
                    <!-- Disabled upload icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px;">
                        <path d="M4 16v1a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1M12 12V4m0 0L8 8m4-4 4 4" />
                    </svg>

                    <!-- Disabled button -->
                    <button disabled style="font-size: 0.9rem; cursor: default;" class="disabled-button">Upload</button>
                </div>
                {% endif %}
            </div>


        </div>
        <div>
            <span id="uploadStatus" style="font-size: 0.85rem; color: gray; margin-left: 0.5rem;"></span>
        </div>
    </div>
</div>

<style>
    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }

    .disabled-button:hover,
    .disabled-button:hover * {
        background-color: inherit !important;
        color: inherit !important;
        /* border-color: inherit !important; */
        cursor: default !important;
        box-shadow: none !important;
        text-decoration: none !important;
    }
</style>
