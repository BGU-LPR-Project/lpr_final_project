version: '3'
services:
  video_service:
    build: ./video_service
    container_name: video-service
    volumes:
      - ./recordings:/app/recordings
    ports:
      - "8000:8000" # Expose for frame retrieval
    depends_on:
      - redis
      - edge_service
    networks:
      - app_network

  edge_service:
    build: ./edge_service
    container_name: edge-service
    volumes:
      - ./models:/app/models # Make sure this points to the correct local directory
    ports:
      - "8001:8000" # Expose for frame processing
    depends_on:
      - redis
      - cloud_service
    networks:
      - app_network

  redis:
    image: "redis:alpine"
    container_name: redis-container # optional: name your container
    networks:
      - app_network
    ports:
      - "6379:6379"
    restart: always
    command: redis-server --maxmemory 6gb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10 --save 60 10000
    volumes:
      - redis_data:/data

  cloud_service:
    build: ./cloud_service
    container_name: cloud-service
    volumes:
      - ./models:/app/models # Make sure this points to the correct local directory
    ports:
      - "8002:8000" # Expose for cloud interactions
    networks:
      - app_network

volumes:
  redis_data:

networks:
  app_network:
    driver: bridge
